<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1a2028" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="700" fill="#0d1218"/>
  <rect width="1200" height="700" fill="url(#grid)"/>
  <rect x="10" y="10" width="1180" height="680" fill="none" stroke="#7fa8d4" stroke-width="1.5"/>

  <text x="40" y="52" fill="#eaf1f7" font-size="21" font-weight="700" letter-spacing="1">INDUSTRIAL MICROGRID CONTROLLER</text>
  <text x="40" y="76" fill="#a8bdd0" font-size="13">Intelligent BESS Dispatch &#8212; Peak Shaving, TOU Arbitrage &amp; Power Factor Correction</text>
  <line x1="40" y1="96" x2="1160" y2="96" stroke="#7fa8d4" stroke-width="1"/>

  <!-- Solar -->
  <rect x="80" y="140" width="180" height="90" fill="none" stroke="#FFC145" stroke-width="1.8"/>
  <text x="170" y="175" fill="#FFC145" font-size="13" text-anchor="middle" font-weight="700">SOLAR PV ARRAY</text>
  <text x="170" y="193" fill="#a8bdd0" font-size="9" text-anchor="middle">Rooftop generation</text>
  <text x="170" y="210" fill="#66707c" font-size="8" text-anchor="middle">0-1000 kW</text>

  <!-- Battery -->
  <rect x="80" y="290" width="180" height="90" fill="none" stroke="#2ECC71" stroke-width="1.8"/>
  <text x="170" y="325" fill="#2ECC71" font-size="13" text-anchor="middle" font-weight="700">BATTERY (BESS)</text>
  <text x="170" y="343" fill="#a8bdd0" font-size="9" text-anchor="middle">500 kW / 550 kVA inverter</text>
  <text x="170" y="360" fill="#66707c" font-size="8" text-anchor="middle">SOC limits 20-95%</text>

  <!-- Grid -->
  <rect x="80" y="440" width="180" height="90" fill="none" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="170" y="475" fill="#7fb3ff" font-size="13" text-anchor="middle" font-weight="700">UTILITY GRID</text>
  <text x="170" y="493" fill="#a8bdd0" font-size="9" text-anchor="middle">Import / export (PCC)</text>
  <text x="170" y="510" fill="#66707c" font-size="8" text-anchor="middle">Time-of-use tariff</text>

  <!-- Lines to controller -->
  <line x1="260" y1="185" x2="440" y2="280" stroke="#FFC145" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="260" y1="335" x2="440" y2="320" stroke="#2ECC71" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="260" y1="485" x2="440" y2="360" stroke="#3B82F6" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- Microgrid controller -->
  <rect x="440" y="250" width="240" height="150" fill="none" stroke="#eaf1f7" stroke-width="1.8"/>
  <text x="560" y="284" fill="#eaf1f7" font-size="13" text-anchor="middle" font-weight="700">MICROGRID CONTROLLER</text>
  <text x="560" y="302" fill="#a8bdd0" font-size="11" text-anchor="middle">Siemens S7-1500</text>
  <text x="560" y="318" fill="#a8bdd0" font-size="11" text-anchor="middle">FB_Microgrid_BESS_Dispatch</text>
  <text x="560" y="336" fill="#66707c" font-size="9" text-anchor="middle">Priority: protect &gt; peak-shave &gt;</text>
  <text x="560" y="350" fill="#66707c" font-size="9" text-anchor="middle">TOU arbitrage &gt; solar charge &gt; idle</text>
  <text x="560" y="368" fill="#66707c" font-size="9" text-anchor="middle">PF correction shares inverter S_rated</text>
  <text x="560" y="384" fill="#66707c" font-size="8" text-anchor="middle">(CODESYS-portable ST)</text>

  <!-- Factory load -->
  <rect x="760" y="290" width="180" height="90" fill="none" stroke="#C8D3DC" stroke-width="1.8"/>
  <text x="850" y="325" fill="#C8D3DC" font-size="13" text-anchor="middle" font-weight="700">FACTORY LOAD</text>
  <text x="850" y="343" fill="#a8bdd0" font-size="9" text-anchor="middle">Active + reactive demand</text>
  <text x="850" y="360" fill="#66707c" font-size="8" text-anchor="middle">Measured at PCC</text>
  <line x1="680" y1="325" x2="760" y2="325" stroke="#eaf1f7" stroke-width="1.6"/>

  <!-- SCADA -->
  <rect x="440" y="450" width="240" height="90" fill="none" stroke="#eaf1f7" stroke-width="1.4"/>
  <text x="560" y="482" fill="#eaf1f7" font-size="12" text-anchor="middle" font-weight="700">SCADA</text>
  <text x="560" y="500" fill="#a8bdd0" font-size="9" text-anchor="middle">Tariff schedule + demand</text>
  <text x="560" y="516" fill="#66707c" font-size="8" text-anchor="middle">threshold configuration</text>
  <line x1="560" y1="450" x2="560" y2="400" stroke="#eaf1f7" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- HMI -->
  <rect x="760" y="450" width="180" height="90" fill="none" stroke="#eaf1f7" stroke-width="1.4"/>
  <text x="850" y="482" fill="#eaf1f7" font-size="12" text-anchor="middle" font-weight="700">ENERGY HMI</text>
  <text x="850" y="500" fill="#a8bdd0" font-size="9" text-anchor="middle">Flow diagram + TOU strip</text>
  <text x="850" y="516" fill="#66707c" font-size="8" text-anchor="middle">SOC, PF, alarms</text>
  <line x1="850" y1="380" x2="850" y2="450" stroke="#eaf1f7" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Title block -->
  <rect x="880" y="600" width="290" height="70" fill="none" stroke="#7fa8d4" stroke-width="1"/>
  <text x="895" y="618" fill="#eaf1f7" font-size="10">DWG NO: MICROGRID-BESS-ARCH-001</text>
  <text x="895" y="633" fill="#eaf1f7" font-size="10">REV: A &#8212; SIMULATION / PORTFOLIO BUILD</text>
  <text x="895" y="648" fill="#eaf1f7" font-size="10">AUTHOR: SIPHO LUCKY SIBANDA</text>
  <text x="895" y="663" fill="#a8bdd0" font-size="9">NOT FOR UTILITY INTERCONNECTION USE</text>
</svg>
